name: Update pkgs/brave

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-brave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure NIX_PATH
        run: echo "NIX_PATH=nixpkgs=https://github.com/NixOS/nixpkgs/archive/nixos-unstable.tar.gz" >> "$GITHUB_ENV"

      - name: Update pkgs/brave
        run: |
          cd pkgs
          script=$(nix build -f default.nix brave.passthru.updateScript --no-link --print-out-paths)
          cd brave
          "$script"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/brave
          delete-branch: true
          commit-message: "chore: update pkgs/brave"
          title: "update pkgs/brave"
          body: |
            automated pkgs/brave update.
          labels: automated, package-update
