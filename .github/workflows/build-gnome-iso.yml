name: Build Image - GNOME

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(join(github.event.commits.*.message, ','), 'chore: update lockfile'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build GNOME ISO
        run: |
          nix run nixpkgs#nixos-generators -- \
            --format iso \
            --flake .#image-gnome-x86_64-linux \
            -o gnome-image

      - name: Upload GNOME ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gnome
          path: gnome-image/iso/*.iso
