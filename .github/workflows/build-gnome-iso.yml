name: Build GNOME ISO

on:
  push:
    paths:
      - 'modules/images/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build GNOME ISO
        run: |
          nix run nixpkgs#nixos-generators -- \
            --format iso \
            --flake .#image-gnome \
            -o gnome-image

          GNOME_SRC=$(echo gnome-image/iso/*.iso)
          GNOME_DST="nixos-gnome-${{ steps.ts.outputs.ts }}.iso"
          cp "$GNOME_SRC" "$GNOME_DST"

      - name: Upload gnome ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gnome
          path: nixos-gnome-${{ steps.ts.outputs.ts }}.iso
