name: Build NixOS ISOs

on:
  push:
    paths:
      - 'modules/images/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Generate timestamp
        id: ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      # -----------------------------------
      # Build Minimal ISO
      # -----------------------------------
      - name: Build minimal ISO
        run: |
          nix run nixpkgs#nixos-generators -- \
            --format iso \
            --flake github:sotormd/nixos#imageMinimal \
            -o /tmp/minimal-image

          MIN_SRC=$(echo /tmp/minimal-image/iso/*.iso)
          MIN_DST="nixos-minimal-${{ steps.ts.outputs.ts }}.iso"
          cp "$MIN_SRC" "$MIN_DST"

      # -----------------------------------
      # Build GNOME ISO
      # -----------------------------------
      - name: Build gnome ISO
        run: |
          nix run nixpkgs#nixos-generators -- \
            --format iso \
            --flake github:sotormd/nixos#imageGnome \
            -o /tmp/gnome-image

          GNOME_SRC=$(echo /tmp/gnome-image/iso/*.iso)
          GNOME_DST="nixos-gnome-${{ steps.ts.outputs.ts }}.iso"
          cp "$GNOME_SRC" "$GNOME_DST"

      # -----------------------------------
      # Build SDCard Image
      # -----------------------------------
      - name: Build sdcard image
        run: |
          nix build github:sotormd/nixos#nixosConfigurations.imageSDCard.config.system.build.sdImage

          SD_SRC=$(echo result/sd-image/*.img.zst)
          SD_DST="nixos-sdcard-${{ steps.ts.outputs.ts }}.img.zst"
          cp "$SD_SRC" "$SD_DST"
      
      # -----------------------------------
      # Upload Artifacts
      # -----------------------------------
      - name: Upload minimal ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-minimal
          path: nixos-minimal-${{ steps.ts.outputs.ts }}.iso

      - name: Upload gnome ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-gnome
          path: nixos-gnome-${{ steps.ts.outputs.ts }}.iso

      - name: Upload sdcard image
        uses: actions/upload-artifact@v4
        with:
          name: nixos-sdcard
          path: nixos-sdcard-${{ steps.ts.outputs.ts }}.img.zst
