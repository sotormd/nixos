name: Build Image - MATE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build MATE ISO
        run: |
          nix run nixpkgs#nixos-generators -- \
            --format iso \
            --flake .#image-mate-x86_64-linux \
            -o mate-image

      - name: Upload MATE ISO
        uses: actions/upload-artifact@v4
        with:
          name: nixos-mate
          path: mate-image/iso/*.iso
